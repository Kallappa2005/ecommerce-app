# =============================================================================
# GitHub Actions — Full CI/CD Pipeline
# =============================================================================
# Triggers: push to main branch
#
# Pipeline:
#  1. Checkout code
#  2. Build & push Docker images to Docker Hub
#  3. SSH into EC2
#  4. Pull latest images
#  5. Rebuild & restart all containers
#  6. Health check verification
#  7. Prune dangling images
#
# Required GitHub Secrets:
#   DOCKER_USERNAME       — Docker Hub username
#   DOCKER_PASSWORD       — Docker Hub password / access token
#   EC2_HOST              — EC2 public IP or domain
#   EC2_USER              — EC2 SSH user (usually 'ubuntu')
#   EC2_SSH_KEY           — EC2 private key (PEM content, not path)
#   EC2_APP_DIR           — Path on EC2 where repo is cloned (e.g. /home/ubuntu/ecommerce-app)
# =============================================================================

name: CI/CD — Build, Push & Deploy

on:
  push:
    branches:
      - main

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}/ecommerce

jobs:
  # ===========================================================================
  # Job 1: Build and push all Docker images
  # ===========================================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout Code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Docker Buildx (for multi-platform builds) ──────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Step 3: Login to Docker Hub ────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Step 4: Generate image tag (short SHA for traceability) ───────────
      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      # ── Step 5: Build and push Gateway ────────────────────────────────────
      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-gateway:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_PREFIX }}-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 6: Build and push User Service ───────────────────────────────
      - name: Build and push User Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/user-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-user-service:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_PREFIX }}-user-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 7: Build and push Product Service ─────────────────────────────
      - name: Build and push Product Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/product-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-product-service:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_PREFIX }}-product-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 8: Build and push Cart Service ───────────────────────────────
      - name: Build and push Cart Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/cart-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-cart-service:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_PREFIX }}-cart-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 9: Build and push Order Service ──────────────────────────────
      - name: Build and push Order Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/order-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-order-service:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_PREFIX }}-order-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 10: Build and push Payment Service ────────────────────────────
      - name: Build and push Payment Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/payment-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-payment-service:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_PREFIX }}-payment-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 11: Build and push Email Service ─────────────────────────────
      - name: Build and push Email Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/email-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-email-service:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_PREFIX }}-email-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 12: Build and push Notification Service ──────────────────────
      - name: Build and push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/notification-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-notification-service:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_PREFIX }}-notification-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Job 2: Deploy to EC2 (runs only after all images are built)
  # ===========================================================================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push  # Wait for all images to be pushed first

    environment: production  # Enables environment protection rules in GitHub

    steps:
      # ── Step 1: SSH into EC2 and deploy ───────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e  # Exit immediately on any error

            echo "======================================"
            echo " Deployment started: $(date)"
            echo "======================================"

            # Navigate to app directory
            cd ${{ secrets.EC2_APP_DIR || '/home/ubuntu/ecommerce-app' }}

            # Pull latest code from main branch
            echo ">> Pulling latest code..."
            git pull origin main

            # Login to Docker Hub on EC2
            echo ">> Logging in to Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull latest images (faster than rebuilding on EC2)
            echo ">> Pulling latest Docker images..."
            docker compose -f docker-compose.prod.yml pull

            # Rebuild and restart all containers (zero-downtime rolling update)
            echo ">> Restarting services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for services to be healthy
            echo ">> Waiting for services to be healthy..."
            sleep 20

            # Health check — Gateway
            echo ">> Verifying API Gateway health..."
            curl -f http://localhost:3000/health || { echo "Gateway health check FAILED"; exit 1; }

            # Health check — RabbitMQ management
            echo ">> Verifying RabbitMQ..."
            curl -f http://localhost:15672 || echo "RabbitMQ management UI not accessible (non-fatal)"

            # Prune dangling images to free disk space
            echo ">> Cleaning up old images..."
            docker image prune -f

            echo "======================================"
            echo " Deployment completed: $(date)"
            echo "======================================"
