# =============================================================================
# Nginx Reverse Proxy Configuration
# =============================================================================
# Routes:
#   /api/*         → API Gateway (port 3000)
#   /              → Frontend SPA (port 5173 or static)
#   /admin/        → Admin SPA (port 5174 or static)
#
# In production (docker-compose.prod.yml), Nginx sits in front of everything
# on port 80 (and 443 with SSL). In development, use the direct ports.
# =============================================================================

upstream api_gateway {
    server gateway:3000;
    keepalive 32;  # Persistent connections to gateway
}

upstream frontend_app {
    server frontend:5173;
}

upstream admin_app {
    server admin:5174;
}

# ── Rate limit zones (shared memory, 10MB = ~160K IP addresses) ───────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

# =============================================================================
# HTTP Server — Redirect all to HTTPS in production
# =============================================================================
server {
    listen 80;
    server_name _;

    # Health check endpoint (bypasses redirect for load balancer probes)
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # In production, uncomment to redirect HTTP → HTTPS:
    # return 301 https://$host$request_uri;

    # For development/local: serve directly
    include /etc/nginx/conf.d/locations.conf;
}

