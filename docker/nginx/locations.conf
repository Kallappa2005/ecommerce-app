# Nginx shared location blocks — included by both HTTP and HTTPS server blocks

# ── Security Headers ──────────────────────────────────────────────────────────
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── API Gateway Proxy ─────────────────────────────────────────────────────────
# All /api/* requests go to the API gateway
location /api/ {
    # Apply rate limiting (burst of 20 with no delay)
    limit_req zone=api_general burst=20 nodelay;

    # Stricter limit for auth endpoints
    location ~ ^/api/user/(login|register|admin) {
        limit_req zone=api_auth burst=5;
        proxy_pass http://api_gateway;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    proxy_pass http://api_gateway;
    include /etc/nginx/conf.d/proxy_params.conf;

    # Increase body size limit for file uploads (product images)
    client_max_body_size 20M;
}

# ── Frontend SPA ──────────────────────────────────────────────────────────────
location / {
    proxy_pass http://frontend_app;
    include /etc/nginx/conf.d/proxy_params.conf;

    # Support React Router (SPA) — return index.html for all non-asset 404s
    proxy_intercept_errors on;
    error_page 404 = @frontend_fallback;
}

location @frontend_fallback {
    proxy_pass http://frontend_app;
}

# ── Admin Panel ───────────────────────────────────────────────────────────────
location /admin {
    proxy_pass http://admin_app;
    include /etc/nginx/conf.d/proxy_params.conf;
}

# ── WebSocket Support (for future real-time features) ─────────────────────────
location /ws/ {
    proxy_pass http://api_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

# ── Static Asset Caching ──────────────────────────────────────────────────────
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://frontend_app;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}
