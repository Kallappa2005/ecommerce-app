# =============================================================================
# Docker Compose — Full Stack (Development)
# =============================================================================
# Starts all services with a single command:
#   docker compose up --build
#
# Services on this network (ecommerce-network):
#   - rabbitmq          :5672  (AMQP), :15672 (Management UI)
#   - gateway           :3000  (API entry point for all clients)
#   - user-service      :4001  (internal)
#   - product-service   :4002  (internal)
#   - cart-service      :4003  (internal)
#   - order-service     :4004  (internal)
#   - payment-service   :4005  (internal)
#   - email-service     (consumer only, no HTTP port)
#   - notification-svc  :4007  (health check only)
#   - frontend          :5173
#   - admin             :5174
# =============================================================================

networks:
  ecommerce-network:
    driver: bridge

volumes:
  rabbitmq_data:

# =============================================================================
# Shared environment variable anchors (YAML anchors for DRY config)
# =============================================================================
x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - ecommerce-network

services:

  # ============================================================================
  # RabbitMQ — Message broker for all async service communication
  # ============================================================================
  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:3-management-alpine
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management web UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================================
  # API Gateway — Single entry point for frontend and admin
  # ============================================================================
  gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: ecommerce-gateway
    ports:
      - "3000:3000"
    environment:
      <<: *rabbitmq-env
      PORT: 3000
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      USER_SERVICE_URL: http://user-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      CART_SERVICE_URL: http://cart-service:4003
      ORDER_SERVICE_URL: http://order-service:4004
      PAYMENT_SERVICE_URL: http://payment-service:4005
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # User Service — Authentication, registration, admin login
  # ============================================================================
  user-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: ecommerce-user-service
    environment:
      <<: *rabbitmq-env
      PORT: 4001
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Product Service — Product CRUD + S3 image uploads
  # ============================================================================
  product-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: ecommerce-product-service
    environment:
      <<: *rabbitmq-env
      PORT: 4002
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Cart Service — Cart read/write (uses ecommerce-users DB)
  # ============================================================================
  cart-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    container_name: ecommerce-cart-service
    environment:
      <<: *rabbitmq-env
      PORT: 4003
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Order Service — Order lifecycle management, status updates
  # ============================================================================
  order-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: ecommerce-order-service
    environment:
      <<: *rabbitmq-env
      PORT: 4004
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4004/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Payment Service — Stripe, Razorpay, COD payment processing
  # ============================================================================
  payment-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: ecommerce-payment-service
    environment:
      <<: *rabbitmq-env
      PORT: 4005
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4005/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Email Service — AWS SES consumer, sends all transactional emails
  # ============================================================================
  email-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/email-service/Dockerfile
    container_name: ecommerce-email-service
    environment:
      <<: *rabbitmq-env
      NODE_ENV: development
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL}
      APP_NAME: ${APP_NAME:-ShopSphere}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ============================================================================
  # Notification Service — RabbitMQ consumer for app notifications
  # ============================================================================
  notification-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: ecommerce-notification-service
    environment:
      <<: *rabbitmq-env
      PORT: 4007
      NODE_ENV: development
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4007/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Legacy Backend — Kept running as rollback safety net (disabled by default)
  # To enable: comment out the 'profiles' line below
  # ============================================================================
  backend:
    <<: *service-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend-legacy
    profiles:
      - legacy   # Only starts when: docker compose --profile legacy up
    ports:
      - "4000:4000"
    environment:
      <<: *rabbitmq-env
    env_file:
      - ./backend/.env
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ============================================================================
  # Frontend — React + Vite (development server)
  # ============================================================================
  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:3000  # Points to gateway
    depends_on:
      - gateway

  # ============================================================================
  # Admin — React + Vite (development server)
  # ============================================================================
  admin:
    <<: *service-defaults
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: ecommerce-admin
    ports:
      - "5174:5174"
    environment:
      VITE_BACKEND_URL: http://localhost:3000  # Points to gateway
    depends_on:
      - gateway
